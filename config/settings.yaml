# Folder the desk opens first. Leave empty to start at the drive list;
# set it to your own PDF/Zotero library folder.
default_folder: ""

# Review-form schema: which dimensions to extract, with prompts, sessions,
# and group styling. Point this at your own YAML to use a different form.
# See config/examples/quick_review.yaml for a minimal template.
schema_path: config/rarf_schema.yaml

sqlite_path: data/rarf.sqlite
output_path: output/RARF_Overview.xlsx
work_dir: data/work
packet_char_budget: 0
packet_warn_chars: 100000
stream_timeout_seconds: 720
wait_timeout_seconds: 90
skip_reconcile_if_clean: true
low_text_char_threshold: 80
model:
  family: grok-4.6
  effort: high
  required_id_substrings:
    - grok
    - "4.6"
  required_label_tokens:
    - high
  no_silent_fallback: true
  backend: local
external:
  provider: zhipu
  base_url: https://open.bigmodel.cn/api/paas/v4
  model_id: glm-5.3-flash
  presets:
    - id: glm-5.3-flash
      label: 智谱 GLM-5.3 Flash
      provider: zhipu
      base_url: https://open.bigmodel.cn/api/paas/v4
      max_parallel: 10
      temperature: 1
      top_p: 0.95
    - id: glm-5.3
      label: 智谱 GLM-5.3
      provider: zhipu
      base_url: https://open.bigmodel.cn/api/paas/v4
      max_parallel: 10
      temperature: 1
      top_p: 0.95
    - id: deepseek-v4-flash
      label: DeepSeek V4 Flash
      provider: deepseek
      base_url: https://api.deepseek.com
      max_parallel: 50
      temperature: 0
    - id: deepseek-v4-pro
      label: DeepSeek V4 Pro
      provider: deepseek
      base_url: https://api.deepseek.com
      max_parallel: 50
      temperature: 0
  parallel_sessions: 5
zotero:
  export_path: ""
  use_api: false
  library_id: ""
  library_type: user
  api_key_env: ZOTERO_API_KEY
cursor:
  local: true
  tools: []
