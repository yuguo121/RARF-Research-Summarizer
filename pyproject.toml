[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rarf-summarizer"
version = "0.1.0"
description = "Summarize Zotero PDFs into Research Article Review Form (RARF) dimensions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "cursor-sdk",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rarf = "rarf_summarizer.cli:main"
rarf-desk = "rarf_summarizer.desk:main"

[tool.setuptools.package-data]
rarf_summarizer = ["web/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
