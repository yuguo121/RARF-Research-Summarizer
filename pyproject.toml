[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rarf-summarizer"
version = "0.1.0"
description = "Turn a folder of research PDFs into a structured, page-cited review-form workbook. Ships with the RARF schema; bring your own YAML."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Yu Guo" }]
keywords = ["literature-review", "zotero", "pdf", "llm", "research"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "cursor-sdk",
]

[project.urls]
Homepage = "https://github.com/yuguo121/RARF-Research-Summarizer"
Repository = "https://github.com/yuguo121/RARF-Research-Summarizer"
Issues = "https://github.com/yuguo121/RARF-Research-Summarizer/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rarf = "rarf_summarizer.cli:main"
rarf-desk = "rarf_summarizer.desk:main"

[tool.setuptools.package-data]
rarf_summarizer = ["web/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
